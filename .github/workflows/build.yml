name: Android Build (Stable Fix)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Node.js (Capacitor Compatible)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3️⃣ Java (IMPORTANT: use 17 for stability)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4️⃣ Install dependencies
      - name: Install Dependencies
        run: npm install --force

      # 5️⃣ Build web app
      - name: Build Web App
        run: npm run build || true

      # 6️⃣ Setup Capacitor (SAFE METHOD)
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          if [ ! -f "capacitor.config.json" ]; then
            cat <<EOF > capacitor.config.json
          {
            "appId": "com.myapp.demo",
            "appName": "MyApp",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF
          fi

          npx cap sync android || npx cap add android

      # 7️⃣ Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8️⃣ Upload APK (SAFE UNIQUE NAME)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
