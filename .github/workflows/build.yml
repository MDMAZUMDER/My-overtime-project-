name: Build Android APK (Stable + Auto Fix)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js (FIX Capacitor Node 22 requirement)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3️⃣ Setup Java (Android requirement)
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4️⃣ Cache Gradle (Speed improve)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      # 5️⃣ Install Dependencies
      - name: Install Dependencies
        run: npm install --force

      # 6️⃣ Build Web App
      - name: Build Web App
        run: |
          npm run build || true
          if [ ! -d "dist" ]; then
            mkdir -p dist
            cp index.html dist/ 2>/dev/null || true
          fi

      # 7️⃣ Setup Capacitor + AUTO Android FIX
      - name: Setup Capacitor (Auto Fix Android)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.myapp.demo",
            "appName": "MyApp",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF

          npx cap add android || true
          npx cap sync android

      # 8️⃣ Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9️⃣ Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # 4️⃣ Install Dependencies
      - name: Install Node Modules
        run: npm install --force

      # 5️⃣ Build Web App
      - name: Build Web App
        run: |
          npm run build || true
          if [ ! -d "dist" ]; then
            mkdir -p dist
            cp index.html dist/ 2>/dev/null || true
          fi

      # 6️⃣ Auto Version Increment (IMPORTANT FOR UPDATES)
      - name: Auto Increase VersionCode
        run: |
          FILE=android/app/build.gradle
          if [ -f "$FILE" ]; then
            VC=$(grep versionCode $FILE | head -1 | awk '{print $2}')
            VC=$((VC+1))
            sed -i "s/versionCode [0-9]*/versionCode $VC/" $FILE
            echo "Updated versionCode to $VC"
          fi

      # 7️⃣ Setup Capacitor
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.myapp.demo",
            "appName": "Myovertime",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF

          npx cap add android || true
          npx cap sync android

      # 8️⃣ Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9️⃣ Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
