name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Give permission to gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. Clean project
      - name: Clean Project
        run: ./gradlew clean

      # 6. Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # 6️⃣ Setup Capacitor (SAFE METHOD)
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          if [ ! -f "capacitor.config.json" ]; then
            cat <<EOF > capacitor.config.json
          {
            "appId": "com.myapp.demo",
            "appName": "MyApp",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF
          fi

          npx cap sync android || npx cap add android

      # 7️⃣ Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8️⃣ Upload APK (SAFE UNIQUE NAME)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
