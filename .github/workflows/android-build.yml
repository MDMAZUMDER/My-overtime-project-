name: Android Build Fix

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout FIRST
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Node.js MUST be here (FIX)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3️⃣ Verify Node (debug)
      - name: Check Node Version
        run: node -v

      # 4️⃣ Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 5️⃣ Install deps
      - name: Install Dependencies
        run: npm install --force

      # 6️⃣ Build web
      - name: Build Web
        run: npm run build || true

      # 7️⃣ Capacitor (NOW works)
      - name: Capacitor Sync
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      # 8️⃣ Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9️⃣ Upload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk          java-version: '17'

      # 6. Give permission to gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 7. Sync Capacitor (Updates Android project with web assets)
      - name: Capacitor Sync
        run: npx cap sync android

      # 8. Clean project
      - name: Clean Project
        run: ./gradlew clean

      # 9. Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
