name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Build Web Assets
      - name: Build Web Assets
        run: npm run build

      # 5. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Sync Capacitor (Updates Android project with web assets)
      - name: Capacitor Sync
        run: npx cap sync android

      # 8. Clean project
      - name: Clean Project
        run: gradle clean

      # 9. Build APK
      - name: Build Debug APK
        run: gradle assembleDebug

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
