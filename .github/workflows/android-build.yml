name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # 4. Build Web Assets
      - name: Build Web Assets
        run: npm run build

      # 5. Set up JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 8. Sync Capacitor (Updates Android project with web assets)
      - name: Capacitor Sync
        run: |
          echo "Listing files to debug structure..."
          ls -R . | grep -E "android|app|build.gradle" | head -n 20
          
          echo "Running Capacitor Sync..."
          # Capacitor CLI v6 uses -v for verbose, but let's use standard sync first
          npx cap sync

      # 9. Clean project
      - name: Clean Project
        run: gradle clean

      # 10. Build APK
      - name: Build Debug APK
        run: gradle assembleDebug

      # 11. Prepare Firebase Hosting Files
      - name: Prepare Hosting Files
        run: |
          mkdir -p public_hosting
          zip -r public_hosting/bundle.zip dist
          VERSION=$(node -p "require('./package.json').version")
          echo "{\"version\": \"$VERSION\", \"url\": \"https://my-overtime-app.web.app/bundle.zip\"}" > public_hosting/version.json

      # 12. Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_OVERTIME_APP }}'
          channelId: live
          projectId: my-overtime-app
        continue-on-error: true

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: overtime-apk
          path: app/build/outputs/apk/debug/*.apk
